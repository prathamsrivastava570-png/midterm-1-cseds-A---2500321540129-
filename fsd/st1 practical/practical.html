<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Library Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f5f1e8;
      color: #2b2118;
      margin: 0;
      padding: 32px 16px;
    }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 2rem; }
    .sub { margin: 0 0 24px; color: #6b5b4b; }

    form {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      margin-bottom: 24px;
    }
    input {
      padding: 10px;
      border: 1px solid #b9a88f;
      border-radius: 4px;
      font: inherit;
      background: #fffdf8;
    }
    input:focus, button:focus-visible { outline: 2px solid #1f4d3a; outline-offset: 1px; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 4px;
      font: inherit;
      cursor: pointer;
      background: #1f4d3a;
      color: #fff;
    }
    button.secondary { background: #e2d8c5; color: #2b2118; }
    button.danger { background: #8c2f2f; }

    table { width: 100%; border-collapse: collapse; background: #fffdf8; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #d9ccb5; }
    th { background: #e8dfcd; }
    td.actions { white-space: nowrap; }
    td.actions button { padding: 6px 10px; font-size: 0.9rem; }
    .empty { padding: 16px; color: #6b5b4b; }
    .error { color: #8c2f2f; margin-bottom: 12px; min-height: 1.2em; }

    @media (max-width: 640px) {
      form { grid-template-columns: 1fr; }
      table { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Library Management System</h1>
    <p class="sub">Add, edit and remove books in the catalogue.</p>

    <p class="error" id="error"></p>

    <form id="book-form">
      <input id="title" placeholder="Title" required />
      <input id="author" placeholder="Author" required />
      <input id="category" placeholder="Category" required />
      <div>
        <button type="submit" id="submit-btn">Add book</button>
        <button type="button" class="secondary" id="cancel-btn" hidden>Cancel</button>
      </div>
    </form>

    <table>
      <thead>
        <tr><th>ID</th><th>Title</th><th>Author</th><th>Category</th><th>Actions</th></tr>
      </thead>
      <tbody id="book-list"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No books yet. Add one above.</p>
  </div>

  <script>
    const API = "/api/books";
    const form = document.getElementById("book-form");
    const titleInput = document.getElementById("title");
    const authorInput = document.getElementById("author");
    const categoryInput = document.getElementById("category");
    const submitBtn = document.getElementById("submit-btn");
    const cancelBtn = document.getElementById("cancel-btn");
    const list = document.getElementById("book-list");
    const emptyMsg = document.getElementById("empty");
    const errorEl = document.getElementById("error");

    let editingId = null; // null = adding, a number = editing that book

    function showError(message) {
      errorEl.textContent = message || "";
    }

    // READ: fetch all books and draw the table
    async function loadBooks() {
      try {
        const res = await fetch(API);
        const books = await res.json();
        renderBooks(books);
        showError("");
      } catch (err) {
        showError("Could not load books. Is the server running?");
      }
    }

    function renderBooks(books) {
      list.innerHTML = "";
      emptyMsg.hidden = books.length > 0;

      books.forEach((book) => {
        const row = document.createElement("tr");

        [book.id, book.title, book.author, book.category].forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value; // textContent keeps user input safe
          row.appendChild(cell);
        });

        const actions = document.createElement("td");
        actions.className = "actions";

        const editBtn = document.createElement("button");
        editBtn.className = "secondary";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", () => startEdit(book));

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger";
        deleteBtn.textContent = "Delete";
        deleteBtn.addEventListener("click", () => deleteBook(book.id));

        actions.append(editBtn, " ", deleteBtn);
        row.appendChild(actions);
        list.appendChild(row);
      });
    }

    // CREATE or UPDATE, depending on editingId
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = {
        title: titleInput.value.trim(),
        author: authorInput.value.trim(),
        category: categoryInput.value.trim(),
      };

      const isEditing = editingId !== null;
      const url = isEditing ? `${API}/${editingId}` : API;
      const method = isEditing ? "PUT" : "POST";

      try {
        const res = await fetch(url, {
          method,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) {
          const err = await res.json();
          return showError(err.error || "Something went wrong");
        }
        resetForm();
        loadBooks();
      } catch (err) {
        showError("Could not save the book. Is the server running?");
      }
    });

    function startEdit(book) {
      editingId = book.id;
      titleInput.value = book.title;
      authorInput.value = book.author;
      categoryInput.value = book.category;
      submitBtn.textContent = "Save changes";
      cancelBtn.hidden = false;
      titleInput.focus();
    }

    function resetForm() {
      editingId = null;
      form.reset();
      submitBtn.textContent = "Add book";
      cancelBtn.hidden = true;
      showError("");
    }

    cancelBtn.addEventListener("click", resetForm);

    // DELETE
    async function deleteBook(id) {
      if (!confirm("Delete this book?")) return;
      try {
        await fetch(`${API}/${id}`, { method: "DELETE" });
        if (editingId === id) resetForm();
        loadBooks();
      } catch (err) {
        showError("Could not delete the book.");
      }
    }

    loadBooks();
  </script>
</body>
</html>
